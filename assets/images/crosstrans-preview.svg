  <text x="60" y="686" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#111a2b" letter-spacing="2">REACT 19 · VITE · CSS MODULES · OXLINT</text>
  <text x="60" y="704" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#0c1420" letter-spacing="1">github.com/sebsnascimentodev/desafio-cross-trans</text>
