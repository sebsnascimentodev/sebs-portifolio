  <rect x="60" y="176" width="1080" height="176" fill="#080b10"/>
  <text x="96" y="222" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#2563eb" letter-spacing="2">// TREINO E MENTORIA PARA HOMENS TRANS</text>
  <text x="96" y="260" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">Seu corpo, seu tempo,</text>
  <text x="96" y="292" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#2563eb">acompanhamento de verdade.</text>
  <text x="96" y="316" font-family="Inter,sans-serif" font-size="11" fill="#64748b">Masculinização do físico com plano individual: peitoral, abdômen e ganho de massa magra.</text>
  <rect x="96" y="330" width="190" height="30" rx="3" fill="#22c55e"/>
  <text x="112" y="350" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#052e13">FALAR NO WHATSAPP ↗</text>

