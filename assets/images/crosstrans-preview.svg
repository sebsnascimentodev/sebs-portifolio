  <rect x="1006" y="142" width="114" height="22" rx="3" fill="#22c55e"/>
  <text x="1020" y="157" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#052e13">WHATSAPP ↗</text>

