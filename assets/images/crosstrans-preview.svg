  <rect x="60" y="130" width="1080" height="46" fill="#0d1117"/>
  <text x="88" y="158" font-family="JetBrains Mono,Consolas,monospace" font-size="14" font-weight="700" fill="#f1f5f9">Desafio Cross Trans</text>
  <g font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#94a3b8" letter-spacing="1">
    <text x="700" y="157">PARA QUEM É</text>
    <text x="822" y="157">RESULTADOS</text>
    <text x="932" y="157">PLANOS</text>
