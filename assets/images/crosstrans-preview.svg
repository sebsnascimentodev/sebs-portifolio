  <text x="772" y="206" font-family="JetBrains Mono,Consolas,monospace" font-size="8" fill="#64748b" letter-spacing="1">ANTES</text>
  <rect x="772" y="222" width="96" height="98" rx="2" fill="#1e293b"/>
  <rect x="896" y="192" width="120" height="140" rx="3" fill="#111827" stroke="rgba(37,99,235,0.35)"/>
  <rect x="896" y="192" width="120" height="20" fill="#0d1117"/>
  <text x="906" y="206" font-family="JetBrains Mono,Consolas,monospace" font-size="8" fill="#2563eb" letter-spacing="1">DEPOIS</text>
  <rect x="908" y="222" width="96" height="98" rx="2" fill="#1e3a5f"/>
  <text x="760" y="344" font-family="JetBrains Mono,Consolas,monospace" font-size="8" fill="#334155">*fotos com máscara de privacidade</text>

  <!-- PARA QUEM É + O QUE VOCÊ RECEBE cards -->
  <text x="96" y="392" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#2563eb" letter-spacing="2">PARA QUEM É · O QUE VOCÊ RECEBE</text>

  <rect x="96" y="404" width="326" height="118" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <circle cx="122" cy="430" r="10" fill="rgba(37,99,235,0.12)" stroke="rgba(37,99,235,0.4)"/>
  <text x="140" y="434" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Treino individualizado</text>
  <text x="118" y="460" font-family="Inter,sans-serif" font-size="9" fill="#64748b">Plano ajustado ao seu momento de</text>
  <text x="118" y="474" font-family="Inter,sans-serif" font-size="9" fill="#64748b">transição e aos seus objetivos.</text>

  <rect x="438" y="404" width="326" height="118" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <circle cx="464" cy="430" r="10" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)"/>
  <text x="482" y="434" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Acompanhamento próximo</text>
  <text x="460" y="460" font-family="Inter,sans-serif" font-size="9" fill="#64748b">Ajustes semanais e suporte direto</text>
  <text x="460" y="474" font-family="Inter,sans-serif" font-size="9" fill="#64748b">via WhatsApp.</text>

  <rect x="780" y="404" width="328" height="118" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <circle cx="806" cy="430" r="10" fill="rgba(37,99,235,0.12)" stroke="rgba(37,99,235,0.4)"/>
  <text x="824" y="434" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Comunidade e depoimentos</text>
  <text x="802" y="460" font-family="Inter,sans-serif" font-size="9" fill="#64748b">Resultados reais de quem já</text>
  <text x="802" y="474" font-family="Inter,sans-serif" font-size="9" fill="#64748b">passou pelo programa.</text>

  <!-- PLANOS strip -->
  <rect x="96" y="540" width="1012" height="90" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <text x="116" y="562" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#2563eb" letter-spacing="2">PLANOS · COMO FUNCIONA · DÚVIDAS</text>
  <rect x="116" y="576" width="220" height="38" rx="3" fill="#111827" stroke="#1e293b"/>
  <text x="132" y="591" font-family="Inter,sans-serif" font-size="10" fill="#f1f5f9">Plano Mensal</text>
  <text x="132" y="605" font-family="Inter,sans-serif" font-size="9" fill="#64748b">acompanhamento contínuo</text>
  <rect x="352" y="576" width="220" height="38" rx="3" fill="#111827" stroke="rgba(37,99,235,0.35)"/>
  <text x="368" y="591" font-family="Inter,sans-serif" font-size="10" fill="#f1f5f9">Plano Trimestral</text>
  <text x="368" y="605" font-family="Inter,sans-serif" font-size="9" fill="#2563eb">mais escolhido</text>
  <rect x="748" y="580" width="140" height="30" rx="3" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)"/>
  <text x="764" y="600" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#22c55e">QUERO COMEÇAR ↗</text>

  <!-- Bottom bar -->
