<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Desafio Cross Trans - landing page de treino e mentoria para homens trans e pessoas transmasculinas">
  <defs>
    <linearGradient id="ctbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0710"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#ctbg)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/>
    <path d="M80 0V720M160 0V720M240 0V720M320 0V720M400 0V720M480 0V720M560 0V720M640 0V720M720 0V720M800 0V720M880 0V720M960 0V720M1040 0V720M1120 0V720"/>
  </g>

  <ellipse cx="280" cy="260" rx="300" ry="200" fill="#2563eb" opacity="0.03"/>
  <ellipse cx="960" cy="480" rx="280" ry="190" fill="#7dd3c0" opacity="0.02"/>

  <!-- TITLE -->
  <text x="60" y="54" font-family="JetBrains Mono,Consolas,monospace" font-size="30" font-weight="700" fill="#2563eb">$</text>
  <text x="96" y="54" font-family="JetBrains Mono,Consolas,monospace" font-size="30" font-weight="700" fill="#f1f5f9"> desafio-cross-trans</text>
  <text x="60" y="74" font-family="JetBrains Mono,Consolas,monospace" font-size="12" fill="#334155" letter-spacing="2">// landing page de conversão · react + vite + css modules</text>

  <rect x="1030" y="38" width="120" height="26" rx="2" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.25)"/>
  <circle cx="1050" cy="51" r="4" fill="#2563eb"/>
  <text x="1062" y="56" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#2563eb" letter-spacing="1">ONLINE</text>

  <!-- BROWSER FRAME -->
  <rect x="60" y="96" width="1080" height="560" rx="6" fill="#0a0d12" stroke="#1e293b"/>
  <rect x="60" y="96" width="1080" height="34" rx="6" fill="#0f1420"/>
  <rect x="60" y="122" width="1080" height="8" fill="#0a0d12"/>
  <circle cx="84" cy="113" r="5" fill="#334155"/>
