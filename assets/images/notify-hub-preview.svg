<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="notify-hub architecture diagram">
  <defs>
    <linearGradient id="nhbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c12"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb" opacity="0.75"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171" opacity="0.7"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#nhbg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/>
    <path d="M80 0V720M160 0V720M240 0V720M320 0V720M400 0V720M480 0V720M560 0V720M640 0V720M720 0V720M800 0V720M880 0V720M960 0V720M1040 0V720M1120 0V720"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="260" rx="520" ry="220" fill="#2563eb" opacity="0.03"/>

  <!-- ── TITLE ── -->
  <text x="60" y="54" font-family="JetBrains Mono,Consolas,monospace" font-size="30" font-weight="700" fill="#2563eb">$</text>
  <text x="96" y="54" font-family="JetBrains Mono,Consolas,monospace" font-size="30" font-weight="700" fill="#f1f5f9"> notify-hub</text>
  <text x="60" y="74" font-family="JetBrains Mono,Consolas,monospace" font-size="12" fill="#334155" letter-spacing="2">// async notification platform · java 21 + spring boot 3.x</text>

  <!-- Status badge -->
  <rect x="1030" y="38" width="120" height="26" rx="2" fill="rgba(74,222,128,0.07)" stroke="rgba(74,222,128,0.22)"/>
  <circle cx="1050" cy="51" r="4" fill="#4ade80"/>
  <text x="1062" y="56" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#4ade80" letter-spacing="1">ACTIVE</text>

  <!-- ══════════════ CLIENT ══════════════ -->
  <rect x="48" y="96" width="168" height="28" rx="3" fill="#0a0f18" stroke="#1e293b"/>
  <text x="68" y="115" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569" letter-spacing="2">CLIENT / PRODUCER</text>
  <line x1="132" y1="124" x2="132" y2="130" stroke="#2563eb" stroke-width="1.5" opacity="0.45" marker-end="url(#arr)"/>

  <!-- ══════════════ REST API ══════════════ -->
  <rect x="48" y="134" width="168" height="110" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <rect x="48" y="134" width="168" height="26" rx="3" fill="#111827"/>
  <rect x="48" y="157" width="168" height="3" fill="#0d1117"/>
  <text x="68" y="151" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">REST API</text>
  <text x="68" y="178" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#4ade80">POST</text>
  <text x="108" y="178" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#94a3b8">/notifications</text>
  <text x="68" y="198" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#2d3748">GET  /notifications/{id}</text>
  <text x="68" y="216" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#2d3748">POST /…/{id}/retry</text>
  <text x="68" y="234" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#2d3748">GET  /notifications</text>

  <!-- Arrow REST API → KAFKA -->
  <line x1="216" y1="188" x2="280" y2="188" stroke="#2563eb" stroke-width="1.5" opacity="0.55" marker-end="url(#arr)"/>
  <circle cx="248" cy="188" r="3" fill="#2563eb" opacity="0.7"/>

  <!-- ══════════════ KAFKA ══════════════ -->
  <rect x="284" y="100" width="184" height="200" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <rect x="284" y="100" width="184" height="26" rx="3" fill="#111827"/>
  <rect x="284" y="123" width="184" height="3" fill="#0d1117"/>
  <text x="304" y="118" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">KAFKA TOPICS</text>
  <!-- pending -->
  <rect x="300" y="132" width="152" height="44" rx="2" fill="#091524" stroke="#1e3a5f"/>
  <text x="316" y="149" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#60a5fa">.pending</text>
  <text x="316" y="166" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#334155">notifications.pending</text>
  <!-- retry -->
  <rect x="300" y="182" width="152" height="44" rx="2" fill="#0f1208" stroke="#3a3a10"/>
  <text x="316" y="199" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#fbbf24">.retry</text>
  <text x="316" y="216" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#334155">notifications.retry</text>
  <!-- dlq -->
  <rect x="300" y="232" width="152" height="44" rx="2" fill="#130808" stroke="#3f1515"/>
  <text x="316" y="249" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#f87171">.dlq</text>
  <text x="316" y="266" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#334155">notifications.dlq</text>

  <!-- Arrow KAFKA → CONSUMER -->
  <line x1="468" y1="196" x2="532" y2="196" stroke="#2563eb" stroke-width="1.5" opacity="0.55" marker-end="url(#arr)"/>
  <circle cx="500" cy="196" r="3" fill="#2563eb" opacity="0.7"/>

  <!-- ══════════════ CONSUMER HUB ══════════════ -->
  <rect x="536" y="100" width="196" height="170" rx="3" fill="#0d1117" stroke="#2563eb" stroke-opacity="0.3"/>
  <rect x="536" y="100" width="196" height="26" rx="3" fill="rgba(37,99,235,0.12)"/>
  <rect x="536" y="123" width="196" height="3" fill="#0d1117"/>
  <text x="556" y="118" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">CONSUMER HUB</text>
  <rect x="554" y="132" width="100" height="17" rx="2" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.25)"/>
  <text x="562" y="144" font-family="JetBrains Mono,Consolas,monospace" font-size="9" fill="#60a5fa" letter-spacing="1">RESILIENCE4J</text>
  <text x="556" y="168" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#4ade80">● CB: CLOSED</text>
  <text x="556" y="186" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">retry: 1s → 2s → 4s</text>
  <text x="556" y="204" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">dedup via Redis</text>
  <text x="556" y="222" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">channel routing</text>
  <text x="556" y="240" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">idempotent consumer</text>
  <text x="556" y="258" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">audit trail → PG</text>

  <!-- Arrow CONSUMER → REDIS -->
  <line x1="634" y1="270" x2="634" y2="292" stroke="#7c3aed" stroke-width="1.4" opacity="0.5" marker-end="url(#arr-dim)"/>

  <!-- ══════════════ REDIS ══════════════ -->
  <rect x="536" y="294" width="196" height="90" rx="3" fill="#0d1117" stroke="#7c3aed" stroke-opacity="0.28"/>
  <rect x="536" y="294" width="196" height="26" rx="3" fill="rgba(124,58,237,0.08)"/>
  <rect x="536" y="317" width="196" height="3" fill="#0d1117"/>
  <text x="556" y="312" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#a78bfa" letter-spacing="2">REDIS</text>
  <text x="556" y="336" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">deduplication · notification-id</text>
  <text x="556" y="354" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">rate limiting · status cache</text>
  <text x="556" y="372" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">TTL: 24h per event key</text>

  <!-- ══════════════ CHANNELS (right) ══════════════ -->

  <!-- EMAIL -->
  <rect x="814" y="100" width="176" height="78" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <rect x="814" y="100" width="176" height="24" rx="3" fill="#111827"/>
  <rect x="814" y="121" width="176" height="3" fill="#0d1117"/>
  <text x="834" y="116" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">EMAIL CHANNEL</text>
  <circle cx="834" cy="142" r="4" fill="#4ade80" opacity="0.8"/>
  <text x="846" y="147" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#94a3b8">JavaMailSender</text>
  <text x="834" y="165" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">timeout: 5s · retries: 3</text>

  <!-- WEBHOOK -->
  <rect x="814" y="196" width="176" height="78" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <rect x="814" y="196" width="176" height="24" rx="3" fill="#111827"/>
  <rect x="814" y="217" width="176" height="3" fill="#0d1117"/>
  <text x="834" y="212" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">WEBHOOK CHANNEL</text>
  <circle cx="834" cy="237" r="4" fill="#4ade80" opacity="0.8"/>
  <text x="846" y="242" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#94a3b8">HTTP POST</text>
  <text x="834" y="260" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">timeout: 10s · retries: 3</text>

  <!-- DLQ -->
  <rect x="814" y="292" width="176" height="78" rx="3" fill="#0d1117" stroke="#3f1515"/>
  <rect x="814" y="292" width="176" height="24" rx="3" fill="#1a0808"/>
  <rect x="814" y="313" width="176" height="3" fill="#0d1117"/>
  <text x="834" y="308" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#f87171" letter-spacing="2">DEAD LETTER QUEUE</text>
  <circle cx="834" cy="333" r="4" fill="#f87171" opacity="0.7"/>
  <text x="846" y="338" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#94a3b8">max retries exceeded</text>
  <text x="834" y="356" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">manual retry via API</text>

  <!-- POSTGRESQL -->
  <rect x="814" y="388" width="176" height="68" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <rect x="814" y="388" width="176" height="24" rx="3" fill="#111827"/>
  <rect x="814" y="409" width="176" height="3" fill="#0d1117"/>
  <text x="834" y="404" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#6688bb" letter-spacing="2">POSTGRESQL</text>
  <text x="834" y="428" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#475569">notifications + audit trail</text>
  <text x="834" y="446" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#334155">immutable append-only log</text>

  <!-- Arrows CONSUMER → Channels -->
  <path d="M732 150 L814 139" stroke="#2563eb" stroke-width="1.4" fill="none" opacity="0.5" marker-end="url(#arr)"/>
  <path d="M732 175 C780 175 780 237 814 237" stroke="#2563eb" stroke-width="1.4" fill="none" opacity="0.4" marker-end="url(#arr)"/>
  <path d="M732 200 C794 200 794 332 814 332" stroke="#f87171" stroke-width="1.4" fill="none" opacity="0.4" marker-end="url(#arr-red)"/>
  <path d="M732 220 C800 220 800 422 814 422" stroke="#334155" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="4,3" marker-end="url(#arr-dim)"/>

  <!-- ══════════════ METRICS BAR ══════════════ -->
  <rect x="0" y="498" width="1200" height="1" fill="#1e293b"/>
  <rect x="0" y="499" width="1200" height="221" fill="#060a0f"/>

  <text x="60" y="530" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#1e3a5f" letter-spacing="2">// PROMETHEUS METRICS · grafana dashboard</text>

  <!-- sent -->
  <rect x="60" y="544" width="310" height="74" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <text x="80" y="564" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#4ade80" letter-spacing="1">notify_hub.sent.total</text>
  <text x="80" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="28" font-weight="700" fill="#f1f5f9">2,481</text>
  <text x="204" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#4ade80">↑ +12/min</text>

  <!-- failed -->
  <rect x="390" y="544" width="310" height="74" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <text x="410" y="564" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#f87171" letter-spacing="1">notify_hub.failed.total</text>
  <text x="410" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="28" font-weight="700" fill="#f1f5f9">17</text>
  <text x="455" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#64748b">0.68% error rate</text>

  <!-- latency -->
  <rect x="720" y="544" width="420" height="74" rx="3" fill="#0d1117" stroke="#1e293b"/>
  <text x="740" y="564" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#fbbf24" letter-spacing="1">notify_hub.latency (p95)</text>
  <text x="740" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="28" font-weight="700" fill="#f1f5f9">42ms</text>
  <text x="808" y="596" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#64748b">p99: 118ms</text>
  <polyline points="1010,608 1028,596 1044,602 1062,588 1080,594 1100,582 1120,590" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.65"/>
  <circle cx="1120" cy="590" r="3" fill="#fbbf24" opacity="0.8"/>

  <!-- Bottom bar -->
  <rect x="0" y="638" width="1200" height="82" fill="#040609"/>
  <rect x="0" y="638" width="1200" height="1" fill="#1e293b"/>
  <text x="60" y="676" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#1e3a5f" letter-spacing="2">JAVA 21 · SPRING BOOT 3 · APACHE KAFKA · REDIS · RESILIENCE4J · POSTGRESQL · PROMETHEUS · GRAFANA · DOCKER</text>
  <text x="60" y="702" font-family="JetBrains Mono,Consolas,monospace" font-size="10" fill="#0f1e32" letter-spacing="1">github.com/sebsnascimentodev/notify-hub</text>
</svg>
